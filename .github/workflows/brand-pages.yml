name: Brand Pages

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'docs/brand/**'
      - 'profile/**'
      - '*.md'
      - 'scripts/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.gitattributes'
      - '.github/workflows/brand-pages.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'docs/brand/**'
      - 'profile/**'
      - '*.md'
      - 'scripts/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.gitattributes'
      - '.github/workflows/brand-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-pages-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'deployment' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, matches brand-assets.yml
      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.4'
          extensions: dom, mbstring, zlib
          tools: composer:v2
          coverage: none
      - name: Install locked development dependencies
        run: composer install --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Verify assets, exports and publication boundaries
        run: composer check
      - name: Build public brand library
        env:
          SOURCE_REF: ${{ github.sha }}
        run: php scripts/build-brand-pages.php --output-dir _site --source-ref "$SOURCE_REF"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
          include-hidden-files: true # The staging script creates only .nojekyll.

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy brand library
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
