name: Brand assets

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'DESIGN.md'
      - 'SOUL.md'
      - 'STYLE.md'
      - 'docs/brand/**'
      - 'resources/skills/fast-forward-dash-art/**'
      - 'references/**'
      - 'profile/assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.gitattributes'
      - '.github/workflows/brand-assets.yml'
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'DESIGN.md'
      - 'SOUL.md'
      - 'STYLE.md'
      - 'docs/brand/**'
      - 'resources/skills/fast-forward-dash-art/**'
      - 'references/**'
      - 'profile/assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - '.gitattributes'
      - '.github/workflows/brand-assets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, mbstring, zlib
          tools: composer:v2
          coverage: none
      - name: Install locked development dependencies
        run: composer install --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress
      - name: Verify assets, exports and publication regression tests
        run: composer check
