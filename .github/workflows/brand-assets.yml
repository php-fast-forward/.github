name: Brand assets

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'DESIGN.md'
      - 'SOUL.md'
      - 'STYLE.md'
      - 'docs/brand/**'
      - 'skills/dash-art/**'
      - 'references/**'
      - 'profile/assets/**'
      - 'scripts/validate-brand.py'
      - 'scripts/build-brand-logos.py'
      - 'scripts/export-design.mjs'
      - 'scripts/design-exports.mjs'
      - 'tests/test_brand_assets.py'
      - 'tests/test_brand_logos.py'
      - 'tests/design-exports.test.mjs'
      - '.gitattributes'
      - '.github/workflows/brand-assets.yml'
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'DESIGN.md'
      - 'SOUL.md'
      - 'STYLE.md'
      - 'docs/brand/**'
      - 'skills/dash-art/**'
      - 'references/**'
      - 'profile/assets/**'
      - 'scripts/validate-brand.py'
      - 'scripts/build-brand-logos.py'
      - 'scripts/export-design.mjs'
      - 'scripts/design-exports.mjs'
      - 'tests/test_brand_assets.py'
      - 'tests/test_brand_logos.py'
      - 'tests/design-exports.test.mjs'
      - '.gitattributes'
      - '.github/workflows/brand-assets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify delivered assets
        run: python3 scripts/validate-brand.py
      - name: Verify native logo and lettering exports
        run: python3 scripts/build-brand-logos.py --check
      - name: Verify corruption and safety failure modes
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Lint design and verify reproducible token exports
        run: node scripts/export-design.mjs --check
      - name: Verify typography interoperability regressions
        run: node --test tests/design-exports.test.mjs
